USE_REGISTRATION_CACHE: False
USE_TRT: True
USE_TRT_HALF: True

CALIBRATION_FILE: 'void/calibration.json'
BACKBONE_FILE: '/workspaces/vdt/vdt_Faster-VoxelPose/void/pose_resnet50_panoptic.pth.tar' # ResNet
FVPMODEL_FILE: '/workspaces/vdt/vdt_Faster-VoxelPose/void/panoptic_model_best.pth.tar' # pretrained

BRISQUE_MODEL_FILE: 'void/brisque_model_live.yml'
BRISQUE_RANGE_FILE: 'void/brisque_range_live.yml'
GESTURES_TASK_PATH: 'void/gesture_recognizer.task'

POSE:
  EXPIRE_SECS: 1
  MIN_SCORE: 0.6
  NECK_DIFF_THRESHOLD: 0.4 # m
  SIMULARITY_THRESHOLD: 0.5 # 0-1.0
  SIMULARITY_IOU_THRESHOLD: 3 # num keypoints
  SIMULARITY_VOL: 3.0 # hack

ARUCO:
  DICT: 'DICT_APRILTAG_36h11'
  IMAGE_CACHE_MAX: 14 # frame averaging
  MARKER_LENGTH: 0.2
  ORIGIN_MARKER_LENGTH: 0.2
  ORIGIN_MARKER: 14
  WINDOW_MARKER: 17
  
DATASET:
  COLOR_RGB: True # BGR<>RGB conversion, affects JointsDataset
  CAMERA_NUM: 4   # just a sanity check against live cameras found
  CAMERA_FPS: 30
  ORI_IMAGE_SIZE: # camera size, set here and fps
    - 960
    - 540
  IMAGE_SIZE:     # input layer size, don't touch
    - 960
    - 512
  HEATMAP_SIZE:   # don't touch
    - 240
    - 128
  NUM_JOINTS: 15 # ResNet()
  TEST_DATASET: 'panoptic' # logging

POSE_FILTERING:
  ENABLED: True
  BETA: 0.05
  FCMIN: 1.0

RS:
  EXPOSURE: 0 # 0: auto, 75, 156, 312 - 30fps, 625 - 15fps, 1250 - 8fps, 2500 - 4fps, 5000 - 2fps
  GAIN: 64 # 0-128, defaujlt: 64
  IR: False

VOID_TRACKING:
  ENABLED: True
  HOST: '10.0.0.134'

CAPTURE_SPEC: # Set all of these.
  SPACE_SIZE:
    - 10000.0
    - 10000.0
    - 2000.0
  SPACE_CENTER:
    - 0.0
    - 0.0
    - 1000.0
  VOXELS_PER_AXIS:
    - 100
    - 100
    - 20
  MAX_PEOPLE: 12
  MIN_SCORE: 0.3

# don't mess with below

BACKBONE: 'resnet'
MODEL: 'faster_voxelpose'
DEVICE: 'cuda:0'

INDIVIDUAL_SPEC:
  SPACE_SIZE:
    - 2000.0
    - 2000.0
    - 2000.0
  VOXELS_PER_AXIS:
    - 64
    - 64
    - 64

CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
